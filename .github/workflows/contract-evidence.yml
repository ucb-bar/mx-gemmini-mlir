name: MX contract and evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Archived source-closure receipts inspect their recorded compiler commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python contract dependencies
        run: python -m pip install -e '.[ir]' 'pytest>=8,<9'
      - name: Check issuer, profile refusal, and archived numerical evidence
        run: |
          python -m tools.report_mx_profile_qualification --check
          python -m pytest -q \
            tests/test_command_ir.py \
            tests/test_bind_profile.py \
            tests/test_verify_profile_ir.py::test_named_asymmetric_contract \
            tests/test_verify_profile_ir.py::test_illegal_contract_rejected \
            tests/test_target_profile.py::test_lut_projection_selects_mode_per_operand \
            tests/test_radiance_mx_gemm_source_parity_roster.py \
            tests/test_radiance_latest_full_roster_evidence.py \
            tests/test_current_radiance_roster_reproduction.py \
            tests/test_upstream_radiance_roster_82be2c7.py \
            tests/test_radiance_mx_build_selection_evidence.py \
            tests/test_generated_nicolas_modes.py \
            tests/test_nicolas_e4m3_lut_pe_evidence.py \
            tests/test_spike_weight_lut_candidate_all_modes_evidence.py \
            tests/test_mx_profile_qualification_catalog.py \
            tests/test_mx_rocket_wrapper_matrix_evidence.py \
            tests/test_nicolas_requantizer_wrapper_evidence.py \
            tests/test_nicolas_resident_128_evidence.py \
            tests/test_resident_pair_object_evidence.py \
            tests/test_fresh_mx_checkout_evidence.py \
            tests/test_selected_mx_profiles_evidence.py \
            tests/test_radiance_fullout_mesh_roster_evidence.py \
            tests/test_radiance_requant_mesh_roster_evidence.py \
            tests/test_radiance_vpu_legal_roster_evidence.py \
            tests/test_source_softmax.py \
            tests/test_vpu_softmax_object.py \
            tests/test_public_vpu_softmax_evidence.py \
            tests/test_radiance_ws_read_once_evidence.py \
            tests/test_radiance_restream_evidence.py \
            tests/test_radiance_batched_gemv_evidence.py \
            tests/test_source_attention_qk.py \
            tests/test_radiance_gqa_qk_evidence.py \
            tests/test_radiance_tilewise_vpu_x2_evidence.py \
            tests/test_radiance_fp4_generated_tilewise_vpu_evidence.py \
            tests/test_radiance_fp4_generated_cyclotron_tiles_evidence.py \
            tests/test_radiance_fp4_runtime_tilewise_object_evidence.py \
            tests/test_radiance_fp8_runtime_source_object_evidence.py \
            tests/test_radiance_fp6_runtime_source_object_evidence.py \
            tests/test_compile_object.py \
            tests/test_compile_object_evidence.py \
            tests/test_resident_vpu_graph.py \
            tests/test_connected_scalar_chain_evidence.py \
            tests/test_connected_scalar_chain_nonzero_evidence.py \
            tests/test_full_vpu_branch_public_evidence.py \
            tests/test_wide_vpu_pair_evidence.py \
            tests/test_square_128_vpu_pair_evidence.py \
            tests/test_host_requant_object_evidence.py \
            tests/test_current_radiance_roster_evidence.py \
            tests/test_current_radiance_f193c8f_replay.py \
            tests/test_nicolas_mx_source_inventory.py \
            tests/test_nicolas_plain_fp8_typed_object_evidence.py \
            tests/test_nicolas_plain_fp8_256_two_wave_evidence.py \
            tests/test_nicolas_plain_fp8_96x96x64_evidence.py \
            tests/test_nicolas_fp8_requant_typed_object_evidence.py \
            tests/test_nicolas_fp4_requant_typed_object_evidence.py \
            tests/test_nicolas_fp4_large_requant_typed_object_evidence.py \
            tests/test_nicolas_fp6_requant_typed_object_evidence.py \
            tests/test_nicolas_plain_fp4_typed_object_evidence.py \
            tests/test_nicolas_plain_fp6_typed_object_evidence.py \
            tests/test_bf16_row_major_readout.py \
            tests/test_bf16_row_major_spike_evidence.py \
            tests/test_fp4_row_major_runtime_object_evidence.py \
            tests/test_muon_mmio_object_evidence.py \
            tests/test_muon_payload_elf_evidence.py \
            tests/test_fp4_muon_payload_evidence.py

  pinned-rtl-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install profile test dependencies
        run: python -m pip install -e '.[ir]' 'pytest>=8,<9'
      - name: Fetch Nicolas's pinned Gemmini and MxGen source
        run: |
          git clone --filter=blob:none --single-branch --branch gemmini-mx-cleanup \
            --no-checkout https://github.com/ucb-bar/gemmini.git /tmp/gemmini-mx-pinned
          git -C /tmp/gemmini-mx-pinned checkout --detach \
            266c593f2cb51d7e3fe83fc0317072b585ac3c52
          git -C /tmp/gemmini-mx-pinned submodule update --init \
            mxgen software/gemmini-rocc-tests
      - name: Check all profiles, VPU softmax binding, and negative selections
        env:
          MX_GEMMINI_RTL_ROOT: /tmp/gemmini-mx-pinned
        run: |
          python -m tools.audit_nicolas_mx_roster \
            --rtl-root "$MX_GEMMINI_RTL_ROOT" \
            --out docs/evidence/nicolas_mx_source_inventory_266c593/index.json --check
          python -m pytest -q tests/test_target_profile.py tests/test_source_softmax.py
