certification:
  phase0_admitted: false
  status: structural_unqualified
compiler_obligations:
- bind exact profile and numerical policy to every generated object
- pad and re-quantize unsupported tails before MX dispatch
- account for every captured operation and provide a compiled host owner
- preserve MX/VPU fences, scales, live state, and full result readback
compute_units:
- accumulate:
  - acc: bf16
    in: mxfp4
    weight: mxfp4
  - acc: bf16
    in: mxfp8
    weight: mxfp8
  dtypes:
  - mxfp4
  - mxfp8
  exposure: external_backend
  kind: systolic
  name: mx_pe
  ops:
  - matmul
  requant:
    ref: mx_gemmini.spad_requant
  scaling: block_e8m0
  semantic_capabilities:
  - arbitrary_mnk: false
    batch: true
    dtypes:
    - mxfp4
    - mxfp8
    family: contraction
    notes: MX source tails require explicit zero padding and scale regeneration
    operand_pairs:
    - in: mxfp4
      weight: mxfp4
    - in: mxfp8
      weight: mxfp8
    ranks:
    - 2
    - 3
    - 4
- dtypes:
  - bf16
  exposure: external_backend
  kind: vector
  name: vpu
  ops:
  - softmax
  semantic_capabilities:
  - dtypes:
    - bf16
    family: softmax
    notes: Only source-checked BF16 row softmax is declared; other VPU ops require
      per-op lowering
    ranks:
    - 2
endpoint_kind: external_backend
family: tensor_resident
mx_direct_modes:
- activation_format: fp4_e2m1
  pe_mode: 0
  weight_format: fp4_e2m1
- activation_format: fp8_e4m3
  pe_mode: 8
  weight_format: fp8_e4m3
mx_resources:
  accumulator_banks: 2
  accumulator_bytes: 65536
  dma_bus_width_bits: 512
  dma_max_bytes: 64
  execute_queue_entries: 8
  has_loop_retire_counter: false
  has_mx_mmio_requant: false
  load_queue_entries: 8
  lut: false
  lut_config: null
  max_in_flight_mem_reqs: 32
  max_spad_writer_bytes: 64
  mx_mmio_base: 536936448
  performance_counters: 8
  requantizer: true
  requantizer_config:
    base_address: 268435456
    gpu_input_lanes: 16
    input_lanes: 64
    max_output_bits: 8
    min_output_bits: 4
    output_lanes: 32
  scale_block_elements: 32
  scale_mem_config:
    banks: 8
    base_address: 536870912
    size_bytes: 16384
    subbank_line_bytes: 16
    subbanks_per_bank: 2
  scratchpad_banks: 4
  scratchpad_bytes: 262144
  spad_requant: true
  store_queue_entries: 2
  vpu: true
  vpu_config:
    exp_sub: true
    exp_sum: true
    units: 2
name: mx_gemmini
notes: Source-derived capability selection only; Spike and RTL qualification are separate.
runtime:
  default_backend: simulator
